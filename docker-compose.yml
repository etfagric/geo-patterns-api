name: geo-patterns-api

services:
  postgres:
    image: postgres:17-alpine
    container_name: geo-patterns-postgres

    environment:
      POSTGRES_DB: treinamento
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
